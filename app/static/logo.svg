<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Tactical Outer Ring -->
  <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.4" fill="#0A1120" />
  
  <!-- Outer Concentric Radar Sweep Arcs -->
  <path d="M 12,18 A 15,15 0 0,1 36,18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 8,24 A 19,19 0 0,1 40,24" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <path d="M 12,30 A 15,15 0 0,0 36,30" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Dynamic IQ Waveform Pulse Lines in Center -->
  <path d="M 9,24 L 15,24 L 18,14 L 21,34 L 24,19 L 27,29 L 30,24 L 39,24" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Center Tactical Beacon Core -->
  <circle cx="24" cy="24" r="3.5" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="24" cy="24" r="1.5" fill="#FFFFFF" />

  <!-- Satellite / Emitter Crosshairs -->
  <line x1="24" y1="5" x2="24" y2="10" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="38" x2="24" y2="43" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="7" y1="24" x2="11" y2="24" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="37" y1="24" x2="41" y2="24" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
</svg>
